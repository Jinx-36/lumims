<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" role="img" aria-labelledby="title description">
  <title id="title">Exposure triangle as a decision model</title>
  <desc id="description">A compact triangle links aperture, shutter speed, and ISO. Each setting includes its exposure role and visual trade-off.</desc>
  <rect width="390" height="780" fill="#F5F0EE"/>
  <style>.heading{fill:#1F1815;font:600 19px Montserrat,Arial,sans-serif}.label{fill:#1F1815;font:600 18px Montserrat,Arial,sans-serif}.detail{fill:#6E6259;font:400 15px Montserrat,Arial,sans-serif}.small{fill:#8B1E1E;font:600 12px Montserrat,Arial,sans-serif;letter-spacing:1.2px}.node{fill:#fff;stroke:#E1D5CE;stroke-width:2}.line{fill:none;stroke:#8B1E1E;stroke-width:4}</style>
  <text x="24" y="38" class="small">EXPOSURE TRIANGLE</text><text x="24" y="68" class="heading">Three linked choices; different</text><text x="24" y="90" class="heading">visual trade-offs.</text>
  <path class="line" d="M195 142L74 415H316Z"/>
  <g transform="translate(72 112)"><rect class="node" width="246" height="106" rx="10"/><text x="123" y="34" text-anchor="middle" class="label">Aperture</text><text x="123" y="60" text-anchor="middle" class="detail">Lens opening controls light.</text><text x="123" y="83" text-anchor="middle" class="detail">Effect: depth of field.</text></g>
  <g transform="translate(24 392)"><rect class="node" width="160" height="144" rx="10"/><text x="80" y="32" text-anchor="middle" class="label">Shutter</text><text x="80" y="54" text-anchor="middle" class="label">speed</text><text x="80" y="84" text-anchor="middle" class="detail">Exposure</text><text x="80" y="104" text-anchor="middle" class="detail">duration.</text><text x="80" y="126" text-anchor="middle" class="small">MOTION</text></g>
  <g transform="translate(206 392)"><rect class="node" width="160" height="144" rx="10"/><text x="80" y="39" text-anchor="middle" class="label">ISO</text><text x="80" y="70" text-anchor="middle" class="detail">Signal/output</text><text x="80" y="90" text-anchor="middle" class="detail">setting.</text><text x="80" y="120" text-anchor="middle" class="small">NOISE / LATITUDE</text></g>
  <text x="195" y="317" text-anchor="middle" class="small">BALANCE FOR DESIRED BRIGHTNESS</text>
  <g transform="translate(24 590)"><rect class="node" width="342" height="110" rx="10"/><text x="20" y="34" class="label">A useful model, not identical mechanics</text><text x="20" y="60" class="detail">Aperture and shutter alter captured light.</text><text x="20" y="83" class="detail">ISO changes the camera's signal/output treatment.</text></g>
  <text x="24" y="744" class="detail">Choose the effect you need, then</text><text x="24" y="766" class="detail">balance the other settings.</text>
</svg>
