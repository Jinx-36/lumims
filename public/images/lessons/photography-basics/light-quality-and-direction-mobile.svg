<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title description">
  <title id="title">Hard and soft light change shadow edges</title>
  <desc id="description">Two stacked panels compare a small direct light source with a large diffused light source on the same subject.</desc>
  <rect width="390" height="720" fill="#F5F0EE"/>
  <style>.heading{fill:#1F1815;font:600 19px Montserrat,Arial,sans-serif}.label{fill:#1F1815;font:600 18px Montserrat,Arial,sans-serif}.detail{fill:#6E6259;font:400 15px Montserrat,Arial,sans-serif}.small{fill:#8B1E1E;font:600 12px Montserrat,Arial,sans-serif;letter-spacing:1.2px}.panel{fill:#fff;stroke:#E1D5CE;stroke-width:2}</style>
  <text x="24" y="38" class="small">LIGHT QUALITY</text><text x="24" y="68" class="heading">Source size changes the</text><text x="24" y="90" class="heading">shadow transition.</text>
  <g transform="translate(24 108)"><rect class="panel" width="342" height="250" rx="10"/><text x="20" y="33" class="label">Small, direct source</text><text x="20" y="56" class="detail">Hard light: defined shadow edge</text><circle cx="54" cy="112" r="24" fill="#C9A96E"/><path d="M78 125L179 171M72 139L156 224" stroke="#8B1E1E" stroke-width="3"/><circle cx="205" cy="150" r="48" fill="#EDE4DF"/><path d="M205 198v39" stroke="#1F1815" stroke-width="13" stroke-linecap="round"/><path d="M234 195L309 229 244 236Z" fill="#511010" opacity=".8"/><text x="20" y="224" class="small">SHARP SHADOW EDGE</text></g>
  <g transform="translate(24 390)"><rect class="panel" width="342" height="250" rx="10"/><text x="20" y="33" class="label">Large or diffused source</text><text x="20" y="56" class="detail">Soft light: gradual shadow edge</text><rect x="26" y="88" width="70" height="50" rx="10" fill="#C9A96E"/><path d="M96 111L177 171M96 128L156 224" stroke="#8B1E1E" stroke-width="3" opacity=".5"/><circle cx="205" cy="150" r="48" fill="#EDE4DF"/><path d="M205 198v39" stroke="#1F1815" stroke-width="13" stroke-linecap="round"/><path d="M234 195L309 229 244 236Z" fill="#511010" opacity=".25"/><path d="M235 197L290 222" stroke="#511010" stroke-width="20" stroke-linecap="round" opacity=".12"/><text x="20" y="224" class="small">GENTLE SHADOW TRANSITION</text></g>
  <text x="24" y="680" class="detail">A window or cloudy sky can act as a broad, soft source.</text>
</svg>
