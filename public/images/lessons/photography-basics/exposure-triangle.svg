<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Exposure triangle as a decision model</title>
  <desc id="description">A triangle connecting aperture, shutter speed, and ISO. Each side lists its effect on exposure decisions and a creative consequence.</desc>
  <rect width="1200" height="720" fill="#F5F0EE"/>
  <style>
    .heading { fill:#1F1815; font:600 28px Montserrat,Arial,sans-serif; }
    .label { fill:#1F1815; font:600 22px Montserrat,Arial,sans-serif; }
    .detail { fill:#6E6259; font:400 17px Montserrat,Arial,sans-serif; }
    .small { fill:#8B1E1E; font:600 14px Montserrat,Arial,sans-serif; letter-spacing:1.5px; }
    .node { fill:#FFFFFF; stroke:#E1D5CE; stroke-width:2; }
    .triangle { fill:none; stroke:#8B1E1E; stroke-width:5; stroke-linejoin:round; }
  </style>
  <text x="72" y="76" class="small">EXPOSURE TRIANGLE</text>
  <text x="72" y="124" class="heading">Three linked choices; three different visual trade-offs.</text>
  <path class="triangle" d="M600 184L253 568H947Z"/>
  <g transform="translate(442 146)">
    <rect class="node" width="316" height="154" rx="12"/>
    <text x="158" y="48" text-anchor="middle" class="label">Aperture</text>
    <text x="158" y="80" text-anchor="middle" class="detail">Lens opening controls captured light.</text>
    <text x="158" y="112" text-anchor="middle" class="detail">Creative effect: depth of field.</text>
  </g>
  <g transform="translate(74 496)">
    <rect class="node" width="352" height="154" rx="12"/>
    <text x="176" y="48" text-anchor="middle" class="label">Shutter speed</text>
    <text x="176" y="80" text-anchor="middle" class="detail">Exposure duration controls captured light.</text>
    <text x="176" y="112" text-anchor="middle" class="detail">Creative effect: motion rendering.</text>
  </g>
  <g transform="translate(774 496)">
    <rect class="node" width="352" height="154" rx="12"/>
    <text x="176" y="48" text-anchor="middle" class="label">ISO</text>
    <text x="176" y="80" text-anchor="middle" class="detail">Signal/output setting used for brightness.</text>
    <text x="176" y="112" text-anchor="middle" class="detail">Trade-off: noise and tonal latitude.</text>
  </g>
  <text x="600" y="422" text-anchor="middle" class="small">BALANCE FOR A DESIRED BRIGHTNESS</text>
  <text x="600" y="453" text-anchor="middle" class="detail">Changing one setting usually asks you to compensate with another.</text>
</svg>
