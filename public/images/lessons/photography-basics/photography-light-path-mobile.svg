<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" role="img" aria-labelledby="title description">
  <title id="title">Photography turns scene light into an image</title>
  <desc id="description">A vertically arranged flow diagram: scene, light, lens, sensor, then image file.</desc>
  <rect width="390" height="780" fill="#F5F0EE"/>
  <style>
    .heading{fill:#1F1815;font:600 19px Montserrat,Arial,sans-serif}.label{fill:#1F1815;font:600 18px Montserrat,Arial,sans-serif}.detail{fill:#6E6259;font:400 15px Montserrat,Arial,sans-serif}.small{fill:#8B1E1E;font:600 12px Montserrat,Arial,sans-serif;letter-spacing:1.3px}.node{fill:#fff;stroke:#E1D5CE;stroke-width:2}.arrow{stroke:#8B1E1E;stroke-width:3;fill:none;stroke-linecap:round}
  </style>
  <text x="24" y="38" class="small">THE PATH OF A PHOTOGRAPH</text>
  <text x="24" y="68" class="heading">A camera records a pattern of light.</text>
  <g transform="translate(61 108)"><rect class="node" width="268" height="86" rx="10"/><circle cx="43" cy="43" r="22" fill="#C9A96E"/><path d="M20 70c8-23 27-33 45-33s36 10 45 33H20Z" fill="#EDE4DF"/><text x="93" y="38" class="label">Scene / subject</text><text x="93" y="61" class="detail">emits or reflects light</text></g>
  <path class="arrow" d="M195 206v31m-12-13 12 13 12-13"/>
  <g transform="translate(61 250)"><rect class="node" width="268" height="72" rx="10"/><path d="M24 27h42m-42 17h42m-42 17h42" stroke="#C9A96E" stroke-width="5" stroke-linecap="round"/><text x="93" y="34" class="label">Light</text><text x="93" y="57" class="detail">travels toward the camera</text></g>
  <path class="arrow" d="M195 334v31m-12-13 12 13 12-13"/>
  <g transform="translate(61 378)"><rect class="node" width="268" height="72" rx="10"/><ellipse cx="45" cy="35" rx="27" ry="16" fill="none" stroke="#8B1E1E" stroke-width="6"/><circle cx="45" cy="35" r="8" fill="#C9A96E"/><text x="93" y="34" class="label">Lens</text><text x="93" y="57" class="detail">directs the light</text></g>
  <path class="arrow" d="M195 462v31m-12-13 12 13 12-13"/>
  <g transform="translate(61 506)"><rect class="node" width="268" height="72" rx="10"/><rect x="25" y="16" width="42" height="40" rx="3" fill="#511010"/><circle cx="46" cy="36" r="11" fill="#F1DCDC"/><text x="93" y="34" class="label">Sensor</text><text x="93" y="57" class="detail">records the light as data</text></g>
  <path class="arrow" d="M195 590v31m-12-13 12 13 12-13"/>
  <g transform="translate(61 634)"><rect class="node" width="268" height="86" rx="10"/><rect x="25" y="18" width="42" height="50" rx="4" fill="#C9A96E"/><text x="93" y="38" class="label">Image file</text><text x="93" y="61" class="detail">processed and stored on a card</text></g>
  <text x="24" y="754" class="detail">Your choices decide how that recorded light will look.</text>
</svg>
