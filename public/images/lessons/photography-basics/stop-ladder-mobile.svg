<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1180" role="img" aria-labelledby="title description">
  <title id="title">One-stop changes in aperture, shutter speed, and ISO</title>
  <desc id="description">Three compact ladders show full-stop steps for aperture, shutter speed, and ISO.</desc>
  <rect width="390" height="1180" fill="#F5F0EE"/>
  <style>.heading{fill:#1F1815;font:600 19px Montserrat,Arial,sans-serif}.label{fill:#1F1815;font:600 17px Montserrat,Arial,sans-serif}.detail{fill:#6E6259;font:400 14px Montserrat,Arial,sans-serif}.small{fill:#8B1E1E;font:600 11px Montserrat,Arial,sans-serif;letter-spacing:1.1px}.cell{fill:#fff;stroke:#E1D5CE;stroke-width:2}</style>
  <text x="24" y="38" class="small">STOPS</text><text x="24" y="68" class="heading">A full stop doubles or halves</text><text x="24" y="90" class="heading">a relationship.</text>
  <g transform="translate(24 130)"><text x="0" y="0" class="heading">Aperture — more to less light</text><g transform="translate(0 24)"><rect class="cell" width="342" height="48" rx="8"/><text x="171" y="30" text-anchor="middle" class="label">f/2.8</text><text x="171" y="68" text-anchor="middle" class="small">−1 STOP</text><rect class="cell" y="82" width="342" height="48" rx="8"/><text x="171" y="112" text-anchor="middle" class="label">f/4</text><text x="171" y="150" text-anchor="middle" class="small">−1 STOP</text><rect class="cell" y="164" width="342" height="48" rx="8"/><text x="171" y="194" text-anchor="middle" class="label">f/5.6</text><text x="171" y="232" text-anchor="middle" class="small">−1 STOP</text><rect class="cell" y="246" width="342" height="48" rx="8"/><text x="171" y="276" text-anchor="middle" class="label">f/8</text></g></g>
  <g transform="translate(24 465)"><text x="0" y="0" class="heading">Shutter — longer to shorter duration</text><g transform="translate(0 24)"><rect class="cell" width="342" height="48" rx="8"/><text x="171" y="30" text-anchor="middle" class="label">1/60 s</text><text x="171" y="68" text-anchor="middle" class="small">−1 STOP</text><rect class="cell" y="82" width="342" height="48" rx="8"/><text x="171" y="112" text-anchor="middle" class="label">1/125 s</text><text x="171" y="150" text-anchor="middle" class="small">−1 STOP</text><rect class="cell" y="164" width="342" height="48" rx="8"/><text x="171" y="194" text-anchor="middle" class="label">1/250 s</text><text x="171" y="232" text-anchor="middle" class="small">−1 STOP</text><rect class="cell" y="246" width="342" height="48" rx="8"/><text x="171" y="276" text-anchor="middle" class="label">1/500 s</text></g></g>
  <g transform="translate(24 800)"><text x="0" y="0" class="heading">ISO — lower to higher output setting</text><g transform="translate(0 24)"><rect class="cell" width="342" height="48" rx="8"/><text x="171" y="30" text-anchor="middle" class="label">ISO 100</text><text x="171" y="68" text-anchor="middle" class="small">+1 STOP</text><rect class="cell" y="82" width="342" height="48" rx="8"/><text x="171" y="112" text-anchor="middle" class="label">ISO 200</text><text x="171" y="150" text-anchor="middle" class="small">+1 STOP</text><rect class="cell" y="164" width="342" height="48" rx="8"/><text x="171" y="194" text-anchor="middle" class="label">ISO 400</text><text x="171" y="232" text-anchor="middle" class="small">+1 STOP</text><rect class="cell" y="246" width="342" height="48" rx="8"/><text x="171" y="276" text-anchor="middle" class="label">ISO 800</text></g></g>
  <text x="24" y="1160" class="detail">Offset one control by the opposite stop for similar brightness.</text>
</svg>
