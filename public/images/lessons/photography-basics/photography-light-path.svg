<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Photography turns scene light into a saved image</title>
  <desc id="description">A five-step flow diagram: scene and subject, light, lens, sensor, then processed and stored image.</desc>
  <rect width="1200" height="620" fill="#F5F0EE"/>
  <style>
    .label { fill:#1F1815; font:600 25px Montserrat,Arial,sans-serif; }
    .detail { fill:#6E6259; font:400 18px Montserrat,Arial,sans-serif; }
    .step { fill:#8B1E1E; font:600 15px Montserrat,Arial,sans-serif; letter-spacing:2px; }
    .node { fill:#FFFFFF; stroke:#E1D5CE; stroke-width:2; }
    .arrow { stroke:#8B1E1E; stroke-width:4; fill:none; stroke-linecap:round; }
  </style>
  <text x="72" y="84" class="step">THE PATH OF A PHOTOGRAPH</text>
  <text x="72" y="130" class="label">A camera records a pattern of light, then turns it into an image file.</text>
  <g transform="translate(72 218)">
    <rect class="node" width="180" height="208" rx="12"/>
    <circle cx="90" cy="70" r="34" fill="#C9A96E"/>
    <path d="M33 159c21-45 51-66 82-66s62 21 83 66H33Z" fill="#EDE4DF"/>
    <text x="90" y="185" text-anchor="middle" class="label">Scene</text>
  </g>
  <path class="arrow" d="M268 322h83m-18-17 18 17-18 17"/>
  <g transform="translate(367 218)">
    <rect class="node" width="180" height="208" rx="12"/>
    <path d="M43 80h94M43 112h94M43 144h94" stroke="#C9A96E" stroke-width="8" stroke-linecap="round"/>
    <text x="90" y="185" text-anchor="middle" class="label">Light</text>
  </g>
  <path class="arrow" d="M563 322h83m-18-17 18 17-18 17"/>
  <g transform="translate(662 218)">
    <rect class="node" width="180" height="208" rx="12"/>
    <ellipse cx="90" cy="103" rx="57" ry="34" fill="none" stroke="#8B1E1E" stroke-width="10"/>
    <circle cx="90" cy="103" r="17" fill="#C9A96E"/>
    <text x="90" y="185" text-anchor="middle" class="label">Lens</text>
  </g>
  <path class="arrow" d="M858 322h83m-18-17 18 17-18 17"/>
  <g transform="translate(957 218)">
    <rect class="node" width="180" height="208" rx="12"/>
    <rect x="47" y="55" width="86" height="93" rx="5" fill="#511010"/>
    <circle cx="90" cy="101" r="24" fill="#F1DCDC"/>
    <text x="90" y="185" text-anchor="middle" class="label">Sensor</text>
  </g>
  <text x="72" y="512" class="detail">The camera processes the sensor data and writes the result to a memory card as an image file.</text>
</svg>
