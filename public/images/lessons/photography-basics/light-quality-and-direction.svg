<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Hard and soft light change shadow edges</title>
  <desc id="description">A comparison diagram of a small direct light creating a sharp shadow and a large diffused light creating a soft shadow on the same subject.</desc>
  <rect width="1200" height="680" fill="#F5F0EE"/>
  <style>
    .label { fill:#1F1815; font:600 27px Montserrat,Arial,sans-serif; }
    .detail { fill:#6E6259; font:400 18px Montserrat,Arial,sans-serif; }
    .small { fill:#8B1E1E; font:600 14px Montserrat,Arial,sans-serif; letter-spacing:1.5px; }
    .panel { fill:#FFFFFF; stroke:#E1D5CE; stroke-width:2; }
  </style>
  <text x="72" y="76" class="small">LIGHT QUALITY</text>
  <text x="72" y="124" class="label">The apparent size of the source changes the transition between light and shadow.</text>
  <g transform="translate(72 186)">
    <rect class="panel" width="498" height="372" rx="12"/>
    <text x="34" y="49" class="label">Small, direct source</text>
    <text x="34" y="79" class="detail">Hard light: a defined shadow edge</text>
    <circle cx="91" cy="156" r="32" fill="#C9A96E"/>
    <path d="M118 178L266 261M107 190L241 335" stroke="#8B1E1E" stroke-width="3"/>
    <circle cx="296" cy="205" r="67" fill="#EDE4DF"/>
    <path d="M296 272v65" stroke="#1F1815" stroke-width="16" stroke-linecap="round"/>
    <path d="M332 270L442 331 366 337Z" fill="#511010" opacity=".8"/>
    <text x="35" y="335" class="small">SHARP-EDGED SHADOW</text>
  </g>
  <g transform="translate(630 186)">
    <rect class="panel" width="498" height="372" rx="12"/>
    <text x="34" y="49" class="label">Large or diffused source</text>
    <text x="34" y="79" class="detail">Soft light: a gradual shadow edge</text>
    <rect x="42" y="121" width="112" height="78" rx="16" fill="#C9A96E"/>
    <path d="M151 150L267 251M151 181L242 337" stroke="#8B1E1E" stroke-width="3" opacity=".5"/>
    <circle cx="296" cy="205" r="67" fill="#EDE4DF"/>
    <path d="M296 272v65" stroke="#1F1815" stroke-width="16" stroke-linecap="round"/>
    <path d="M332 270L442 331 366 337Z" fill="#511010" opacity=".25"/>
    <path d="M332 270L414 323" stroke="#511010" stroke-width="28" stroke-linecap="round" opacity=".12"/>
    <text x="35" y="335" class="small">GRADUAL SHADOW TRANSITION</text>
  </g>
  <text x="72" y="622" class="detail">Move your subject, move the source, or use a window or cloudy sky: direction and apparent source size both change the picture.</text>
</svg>
